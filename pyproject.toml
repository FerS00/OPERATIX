[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "operatix"
version = "0.1.0"
description = "Agente de automatizacion empresarial basado en chat, hojas de calculo y dashboards."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.15,<2",
    "dash>=3.2,<5",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "gspread>=6.2,<7",
    "langchain>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-google-genai>=3.0,<5",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "openpyxl>=3.1,<4",
    "plotly>=6,<7",
    "pyjwt>=2.9,<3",
    "pydantic>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pymysql>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
operatix = "operatix.presentation.cli:main"
operatix-web = "operatix.presentation.dash_app:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/operatix"]

[tool.pytest.ini_options]
addopts = "-q --cov=operatix --cov=backend --cov-report=term-missing"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/routes/*.py" = ["B008"]
